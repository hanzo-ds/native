name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

  debrand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: no vendor brand outside the files that must keep it
        run: |
          # Exclusions, and why each one is permanent:
          #   LICENSE, AUTHORS  upstream copyright notices, Apache-2.0 requires them
          #   query.go          db.system is an OpenTelemetry enum whose registered
          #                     value for this DBMS is fixed by the specification
          #   README.md         names clickhouse-local, the binary our own server
          #                     image actually ships
          #   proto_test.go     names the retired brand to assert we never send it
          #   ci.yml            this gate names the token it searches for
          hits=$(grep -ril clickhouse . \
            --exclude-dir=.git \
            --exclude=LICENSE --exclude=AUTHORS \
            --exclude=query.go --exclude=README.md \
            --exclude=proto_test.go \
            --exclude=ci.yml || true)
          if [ -n "$hits" ]; then
            echo "vendor brand reintroduced in:"; echo "$hits"
            grep -rin clickhouse $hits | head -50
            exit 1
          fi
          echo "clean"
